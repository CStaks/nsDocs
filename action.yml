name: 'nsdocs Wiki Builder'
description: 'Builds lightweight HTML wikis from Markdown using nsdocs'
author: 'CStaks'
branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  config:
    description: 'Path to nsdocs config file'
    required: false
    default: 'nsdocs.yml'
  check:
    description: 'Verify pages are up to date without writing (CI mode)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      shell: bash
      run: python -m pip install pyyaml

    - name: Run nsdocs engine
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ inputs.check }}" = "true" ]; then
          EXTRA_FLAGS="--check"
        fi
        python3 ${{ github.action_path }}/nsdocs.py --config "${{ inputs.config }}" $EXTRA_FLAGS
